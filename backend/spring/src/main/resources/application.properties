# Application
spring.application.name=CycloneSense
server.port=8000

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# H2 Database (In-memory for demo)
spring.datasource.url=jdbc:h2:mem:cyclonesense
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# FastAPI ML Service URL
ml.api.base-url=http://localhost:8001

# Logging
logging.level.com.cyclonesense=DEBUG
logging.level.org.springframework.web=INFO
